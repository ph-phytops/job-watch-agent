# Daily cloud run: the agent no longer depends on any personal machine.
# Secrets (mailbox credentials) live in the repository's Actions secrets.
name: daily-digest

on:
  schedule:
    # Fires at 04:47 Paris all year: the timezone key keeps the delivery time
    # stable across the winter clock change, which a bare UTC cron cannot do.
    # The hour sits in the quietest window for Actions load, and the odd minute
    # follows GitHub's own advice to avoid the start of an hour. Both are
    # best effort: the docs promise no punctuality and may drop a run outright.
    - cron: "47 4 * * *"
      timezone: "Europe/Paris"
  workflow_dispatch: # manual "Run workflow" button for testing

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run the agent
        env:
          JOBWATCH_EMAIL_USER: ${{ secrets.JOBWATCH_EMAIL_USER }}
          JOBWATCH_EMAIL_PASSWORD: ${{ secrets.JOBWATCH_EMAIL_PASSWORD }}
          JOBWATCH_NOTIFY_TO: ${{ secrets.JOBWATCH_NOTIFY_TO }}
        run: uv run --locked jobwatch.py --profile pierre

      - name: Commit new digest and memory
        run: |
          git config user.name "job-watch-agent"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profiles/pierre/digests profiles/pierre/data/seen.json
          git diff --cached --quiet || git commit -m "Daily digest ($(date -u +%F))"
          git push
