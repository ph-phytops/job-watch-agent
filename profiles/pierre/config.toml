# A defence prime, and the largest Ashby board on this list at over 150
# postings. Almost all of them are engineering, production and field titles:
# only two cross the title filter today, and both sit outside Europe. Kept
# anyway: it adds roughly forty postings a month, so the programme titles it
# publishes rarely are still worth watching for.
[[companies]]
name = "Harmattan AI"
ats = "ashby"
slug = "harmattan-ai"

# The two entries below are the first French employers on this list, and they
# are here because the collector learned to read two more ATS. Neither could be
# reached before, which looked from the outside like an absence of postings.

# Teamtailor. The slug is the subdomain, and it answers even though the site is
# served from the employer's own domain.
[[companies]]
name = "OpCore"
ats = "teamtailor"
slug = "opcore"

# SmartRecruiters, and the largest board on this list by far, a few hundred
# postings against a few dozen for the tech boards above. Mind the slug's
# capitals: an unknown company answers 200 with an empty board rather than an
# error, so a typo reads exactly like a board with nothing open.
[[companies]]
name = "Iliad - Free"
ats = "smartrecruiters"
slug = "Iliad-Free"


[[companies]]
name = "NVIDIA"
ats = "workday"
slug = "nvidia/wd5/NVIDIAExternalCareerSite?countries=France, Netherlands, United Kingdom, Germany, Spain, Finland"

[[companies]]
name = "Equinix"
ats = "workday"
slug = "equinix/wd1/External?countries=France"

# Collective, a freelance marketplace. The target is a public search, not an
# employer, and each posting keeps the company it names. The search ranks by
# relevance and serves missions from months back next to today's, so days=
# drops anything published longer ago than that. Its alert emails cannot
# stand in for this: they count the new postings and link to the logged-in
# app, without naming a single one.
[[companies]]
name = "Collective"
ats = "collective"
slug = "chef de projet data?contractType=Freelance&days=60"


# Google, Microsoft, AWS and Meta have proprietary career sites without a
# public ATS API: they are covered through LinkedIn per-company email alerts
# (zero code) and boosted by the scoring section below when they appear.

# --- Scoring -----------------------------------------------------------
# Transparent, additive scoring: every point appears in the digest with its
# reason. Title keywords accumulate; company and location keep only their
# single best match.

[scoring.title]
"technical program" = 30
"tpm" = 30
"program manager" = 25
"datacenter" = 25
"data center" = 25
"data centre" = 25
"infrastructure" = 20
"capacity" = 20
"compute" = 15
"deployment" = 15
# Same weight as "deployment", which it is the other half of: the target role
# list in this file says "Capacity Delivery", and that phrase scored nothing.
"delivery" = 15
"freelance" = 10
# Data project management is a lane of its own since the Collective search
# was added, and "data" alone scored nothing: "Chef de projet Data senior"
# ranked 30th behind unrelated infrastructure postings. Only titles that
# already passed the title filter are scored, so "data" here reaches project
# and programme roles, not data engineering. Measured on 453 open postings:
# 47 gain points, none outside the lane rises above 50.
"data" = 15
"cloud" = 10
"project manager" = 10
"senior" = 5
"director" = -10
"junior" = -15

# French, weighted like the English twin above so the same job ranks the same
# in either language. Until the collector could read a French board these
# weights had nothing to score; once it could, the postings arrived and ranked
# below generic English ones because nothing here spoke French. Checked
# against 2118 real titles: 302 postings gain points, none lose any.
"de projet" = 10        # twin of "project manager"
"de programme" = 25     # twin of "program manager"
"déploiement" = 15      # twin of "deployment"
# No English twin, this is the network vocabulary the profile targets. On the
# same 2118 titles "réseau" reaches network engineering roles only: a social
# media title never gets here, it does not pass the filter.
"réseau" = 10
"fibre" = 10


[scoring.company]
"Mistral AI" = 30
"Anthropic" = 25
"CoreWeave" = 25
"OpenAI" = 25
"Nebius" = 22
"Databricks" = 22
"Lambda" = 20
"Nscale" = 20
"Google" = 20
"Microsoft" = 18
"Meta" = 18
"AWS" = 18
"Amazon" = 15
"Scale AI" = 15
"Cohere" = 15
"xAI" = 15
"Scaleway" = 12
"Fireworks" = 12

[scoring.location]
"remote" = 30
"à distance" = 30
"télétravail" = 25
"paris" = 25
"france" = 20
"emea" = 15
"europe" = 15
"hybride" = 10
"london" = 5
"amsterdam" = 5

# Out of reach, so out of the reading slots. These only started working with
# the scoring change: while a table kept its single best match, "US - Remote"
# scored the +30 of "remote" and no negative could ever outrank it. Penalties
# now add up, so a location says no once per city it lists.
#
# -50 rather than -15, measured: at -15 four US postings still held slots in
# the top 20, at -50 nineteen of the twenty are European. Nothing European
# loses a point, and no posting gains one.
#
# NO TWO-LETTER STATE CODES beyond the two below, and that is not an oversight.
# ", ca" catches Cannes and Caen, ", ma" catches Madrid and Marseille, ", wa"
# catches Warsaw, ", co" catches Copenhagen. None of them showed up in today's
# corpus, which proves nothing about next week: a penalty is written against
# what a string CAN contain, not against what it happened to contain. City
# names carry the same coverage without the trap. "austin" was dropped for
# exactly this reason, it catches Austin Friars in London.
"united states" = -50
"us - " = -50            # the space matters: "US - Remote", nothing else
", tx" = -50             # no European city abbreviates this way
", nj" = -50
"new york" = -50
"san francisco" = -50
"seattle" = -50
"sunnyvale" = -50
"bellevue" = -50
"boston" = -50
"houston" = -50
"denver" = -50
"chicago" = -50
"atlanta" = -50
"los angeles" = -50
"san jose" = -50
"santa clara" = -50
"mountain view" = -50
"palo alto" = -50
"menlo park" = -50
"redmond" = -50
"columbus" = -50
"richmond" = -50
"livingston" = -50
"greensboro" = -50
# Same reasoning, other continents: a posting there cannot be taken from Paris.
"india" = -50
"hyderabad" = -50
"bangalore" = -50
"singapore" = -50
"apac" = -50
"israel" = -50
"tel aviv" = -50
"tokyo" = -50
"sydney" = -50
"toronto" = -50
"canada" = -50

[scoring.extras]
network_bonus = 15   # "N anciens collègues / relations" in the alert
rate_threshold = 600 # €/day
rate_bonus = 10

# --------------------------------------------------------------------------
# Optional qualitative pass, LOCAL ONLY (`uv run jobwatch.py --llm`).
#
# The scheduled cloud run never touches this: it stays deterministic, free
# and credential-free. The model reads the full descriptions of the finalists
# only, on the machine of whoever has twenty minutes to act on the result.
# --------------------------------------------------------------------------
[llm]
command = "claude"                 # CLI the prompt is piped into (must be on PATH)
args = ["-p"]                      # non-interactive mode
top_n = 20                         # finalists whose description gets read
                                   # (never-reviewed ones: see --recheck)
max_chars = 6000                   # per-posting budget sent to the model
profile_path = "data/profile.md"   # gitignored: your profile never gets published
batch_size = 10                    # offres par appel au modele (un lot qui echoue n'annule pas les autres)
