# job-watch-agent configuration
# Companies are watched through the public job-board APIs of their ATS
# (Greenhouse, Lever or Ashby). No scraping, no authentication required.

[search]
# A job is kept if its title contains at least one of these terms...
# (management titles only, since context keywords like "infrastructure" belong
# to the future scoring step, they match far too many engineering roles)
include_keywords = [
    "program manager",
    "technical program",
    "tpm",
    "program management",
    "project manager",
    "chef de projet",
]
# Adjacence GTM technique (solutions architect, forward deployed, technical
# account, partnerships) testée le 01/09 puis retirée le 02/09 : sur les 14
# cibles, elle n'a produit que deux offres, toutes deux aux États-Unis et
# écartées à la lecture, pour un bruit multiplié par vingt (Databricks est
# passé de 16 à 305 correspondances). Les postes GTM de ces sociétés sont
# aux États-Unis ; en chercher en France demanderait d'autres cibles.
# ...and none of these.
exclude_keywords = ["intern", "internship", "stage", "alternance", "apprentice", "stagiaire"]

# --- Email alerts ------------------------------------------------------
# The agent also reads a dedicated mailbox receiving daily job alerts.
# Credentials live in .env (never committed): JOBWATCH_EMAIL_USER /
# JOBWATCH_EMAIL_PASSWORD. See profiles.example/someone/.env.example.

[email]
enabled = true
imap_host = "imap.gmail.com"
# Generous overlap: the cross-run memory dedupes anyway, and a wide window
# avoids missing alerts if a daily run is skipped.
since_days = 4
# The mailbox is dedicated to job alerts: scan every recent message.
# (Alerts may arrive forwarded, so filtering by sender is unreliable;
# add entries here only if you need to narrow the search.)
senders = []

# --- Notification ------------------------------------------------------
# When new positions are found, send the digest to JOBWATCH_NOTIFY_TO (.env).

[notify]
enabled = true

