# job-watch-agent configuration
# Companies are watched through the public job-board APIs of their ATS
# (Greenhouse, Lever or Ashby). No scraping, no authentication required.

[search]
# A job is kept if its title contains at least one of these terms...
# (management titles only, since context keywords like "infrastructure" belong
# to the future scoring step, they match far too many engineering roles)
include_keywords = [
    "program manager",
    "technical program",
    "tpm",
    "program management",
    "project manager",
    "chef de projet",
    # French, and deliberately shorter than the job title they stand for.
    # A French board writes the same job a dozen ways: "chef de projet",
    # "cheffe", "chef(fe)", "chef.fe", "chef-fe", "chef / cheffe", "chef ou
    # cheffe". Listing the spellings would always be one short, and 44 real
    # titles were being dropped on that alone. "de projet" catches every one
    # of them, and "chargé de", "directeur de" and "pilote de" with them.
    # Measured on 2118 real titles: 81 more kept in this profile's lane, 22
    # more outside it, and not one English posting gained or lost.
    "de projet",
    "de programme",
    # The two shapes that drop the "de" altogether.
    "responsable projet",
    "responsable programme",
    # "Capacity Delivery" is named as a target role further down this file and
    # no keyword here reached it: the word "delivery" was missing entirely.
    # What was being dropped is exactly the lane, not its edges: "Senior Data
    # Center Capacity Delivery Manager", "Supply Chain Delivery Manager, Data
    # Center Power & Cooling", "AI Delivery Manager - Paris". Measured on 2118
    # real titles: 50 more kept in the lane, 2 outside it, both of them
    # "Service Delivery Manager", which is adjacent rather than wrong.
    "delivery manager",
    "delivery lead",
    "deployment lead",
    "deployment manager",
]
# Adjacence GTM technique (solutions architect, forward deployed, technical
# account, partnerships) testée le 01/09 puis retirée le 02/09 : sur les 14
# cibles, elle n'a produit que deux offres, toutes deux aux États-Unis et
# écartées à la lecture, pour un bruit multiplié par vingt (Databricks est
# passé de 16 à 305 correspondances). Les postes GTM de ces sociétés sont
# aux États-Unis ; en chercher en France demanderait d'autres cibles.
# ...and none of these.
# "alternant" is not a substring of "alternance", and it is the word titles
# use ("Alternant(e) Chef de projet ..."): two such postings were getting in.
exclude_keywords = ["intern", "internship", "stage", "alternance", "alternant", "apprentice", "stagiaire"]

# --- Email alerts ------------------------------------------------------
# The agent also reads a dedicated mailbox receiving daily job alerts.
# Credentials live in .env (never committed): JOBWATCH_EMAIL_USER /
# JOBWATCH_EMAIL_PASSWORD. See profiles.example/someone/.env.example.

[email]
enabled = true
imap_host = "imap.gmail.com"
# Generous overlap: the cross-run memory dedupes anyway, and a wide window
# avoids missing alerts if a daily run is skipped.
since_days = 4
# The mailbox is dedicated to job alerts: scan every recent message.
# (Alerts may arrive forwarded, so filtering by sender is unreliable;
# add entries here only if you need to narrow the search.)
senders = []

# --- Notification ------------------------------------------------------
# When new positions are found, send the digest to JOBWATCH_NOTIFY_TO (.env).

[notify]
enabled = true

