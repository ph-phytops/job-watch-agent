# Google, Microsoft, AWS and Meta have proprietary career sites without a
# public ATS API: they are covered through LinkedIn per-company email alerts
# (zero code) and boosted by the scoring section below when they appear.

# --- Scoring -----------------------------------------------------------
# Transparent, additive scoring: every point appears in the digest with its
# reason. Title keywords accumulate; company and location keep only their
# single best match.

[scoring.title]
"technical program" = 30
"tpm" = 30
"program manager" = 25
"datacenter" = 25
"data center" = 25
"data centre" = 25
"infrastructure" = 20
"capacity" = 20
"compute" = 15
"deployment" = 15
"freelance" = 10
"cloud" = 10
"project manager" = 10
"senior" = 5
"director" = -10
"junior" = -15

[scoring.company]
"Mistral AI" = 30
"Anthropic" = 25
"CoreWeave" = 25
"OpenAI" = 25
"Nebius" = 22
"Databricks" = 22
"Lambda" = 20
"Nscale" = 20
"Google" = 20
"Microsoft" = 18
"Meta" = 18
"AWS" = 18
